name: Evaluate NPC answer accuracy
on:
  push:
    branches: [qa/npc-answer-accuracy]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Qwen3-4B-Q4
            url: https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf
            sha: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          - label: Qwen35-9B-Q4
            url: https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf
            sha: 03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8
          - label: Qwen35-9B-Q3
            url: https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q3_K_M.gguf
            sha: 8fed90306e4f019e2bf35f3766470b7bc59ea1a9dae00f5ceb20b43cb5514393
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build evaluation probe
        run: bash ci/npc-accuracy/setup.sh
      - name: Download and verify the model
        env:
          MODEL_URL: ${{ matrix.url }}
          MODEL_SHA: ${{ matrix.sha }}
        run: |
          curl -fLsS --retry 3 "$MODEL_URL" -o "$RUNNER_TEMP/model.gguf"
          printf '%s  %s\n' "$MODEL_SHA" "$RUNNER_TEMP/model.gguf" | shasum -a 256 -c -
      - name: Evaluate six questions under five conditions
        run: python3 ci/npc-accuracy/run.py "$RUNNER_TEMP/probe/dcj_local_llm_probe" "$RUNNER_TEMP/model.gguf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.label }}-answers
          path: results/
          if-no-files-found: ignore
