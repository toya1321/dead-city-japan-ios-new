name: Build SideStore IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deadcity_source.zip
permissions:
  contents: write
concurrency:
  group: ios-unsigned
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game source
        run: unzip -q deadcity_source.zip -d game
      - name: Export Godot and compile unsigned IPA
        run: bash game/build_scripts/build-ios-unsigned.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeadCityJapan-SideStore-unsigned
          path: |
            game/build/DeadCityJapan-Godot-unsigned.ipa
            game/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish private IPA download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create v0.19.0-test19
          game/build/DeadCityJapan-Godot-unsigned.ipa game/build/SHA256SUMS.txt game/TEST_REPORT_V19.md
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "DEAD CITY JAPAN CHRONICLE v19 - unsigned test IPA"
          --notes "CHRONICLE TEST 19. Full-command action validation, finite NPC supplies, event image fallbacks, exact save continuation, and landscape text UI. Godot 4.6.3 source tests run in this build. Unsigned arm64 iPhoneOS IPA for SideStore re-signing. Real iPhone installation, Japanese keyboard, safe area, and decades-scale simulation remain unverified. See attached TEST_REPORT_V19.md."
          --prerelease
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            game/build/*.log
            game/build/test-results/
          if-no-files-found: ignore
