name: Build SideStore IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deadcity_source.zip
permissions:
  contents: write
concurrency:
  group: ios-unsigned
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game source
        run: unzip -q deadcity_source.zip -d game
      - name: Export Godot and compile unsigned IPA
        run: bash game/build_scripts/build-ios-unsigned.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeadCityJapan-SideStore-unsigned
          path: |
            game/build/DeadCityJapan-Godot-unsigned.ipa
            game/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish private IPA download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create v0.21.0-test21
          game/build/DeadCityJapan-Godot-unsigned.ipa game/build/SHA256SUMS.txt game/TEST_REPORT_V21.md deadcity_source.zip
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "DEAD CITY JAPAN CHRONICLE v21 - unsigned test IPA"
          --notes "CHRONICLE TEST 21. Five-item revision: swipe/tap arbitration on both panels; room/street/shop journeys; positive vitality gauges; configurable protagonist and ordinary-life prologue; 40 stateful autonomous events with delayed/nearby information gating, finite stocks, persistent cooldowns and archive counts. All Godot regression tests run before compilation. Source ZIP and test report attached. Backgrounds are state-aware schematic fallbacks; dedicated anime event illustrations and real iPhone keyboard/touch verification remain incomplete. Unsigned arm64 iPhoneOS IPA for SideStore re-signing."
          --prerelease
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            game/build/*.log
            game/build/test-results/
          if-no-files-found: ignore
