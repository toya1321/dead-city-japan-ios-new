name: Build SideStore IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deadcity_source.zip
permissions:
  contents: write
concurrency:
  group: ios-unsigned
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game source
        run: unzip -q deadcity_source.zip -d game
      - name: Export Godot and compile unsigned IPA
        run: bash game/build_scripts/build-ios-unsigned.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeadCityJapan-SideStore-unsigned
          path: |
            game/build/DeadCityJapan-Godot-unsigned.ipa
            game/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish private IPA download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create v0.23.0-test23
          game/build/DeadCityJapan-Godot-unsigned.ipa game/build/SHA256SUMS.txt game/TEST_REPORT_V23.md deadcity_source.zip
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "DEAD CITY JAPAN CHRONICLE v23 - unsigned test IPA"
          --notes "CHRONICLE TEST 23. Fixes reported touch scrolling and nonresponsive right-panel actions. Reproduced a cold-start emulated-mouse-before-touch capture deadlock using the Godot input pipeline. Scroll areas now suppress emulated mouse independently of event order and reset capture on pause/visibility changes. Adds scaled physical-input tests and preserves desktop mouse and standard GUI emulation. All 31 tests run before compilation. Real iPhone finger testing remains unverified. Source ZIP and focused test report attached. Unsigned IPA for SideStore re-signing."
          --prerelease
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            game/build/*.log
            game/build/test-results/
          if-no-files-found: ignore
