name: Build SideStore IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deadcity_source.zip
permissions:
  contents: write
concurrency:
  group: ios-unsigned
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game source
        run: unzip -q deadcity_source.zip -d game
      - name: Export Godot and compile unsigned IPA
        run: bash game/build_scripts/build-ios-unsigned.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeadCityJapan-SideStore-unsigned
          path: |
            game/build/DeadCityJapan-Godot-unsigned.ipa
            game/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish private IPA download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create v0.24.0-test24
          game/build/DeadCityJapan-Godot-unsigned.ipa game/build/SHA256SUMS.txt game/TEST_REPORT_V24.md deadcity_source.zip
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "DEAD CITY JAPAN CHRONICLE v24 - unsigned test IPA"
          --notes "CHRONICLE TEST 24. Replaces the action menu with multiline text input and a two-column scene/chronicle UI. Adds 12 generated photoreal location backgrounds. Managed waits consume finite food/water and include sleep, interrupting on shortage or felt health deterioration. Supports validated multi-action text plans and opt-in AI connection settings. All 35 tests run before export. Actual LLM service and iPhone hardware testing remain unverified; offline parsing works without setup. Unsigned IPA for SideStore re-signing. Source and report attached."
          --prerelease
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            game/build/*.log
            game/build/test-results/
          if-no-files-found: ignore
