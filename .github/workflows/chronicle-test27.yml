name: Build Chronicle TEST27 IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [deadcity_test27.zip]
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Unpack game
        run: unzip -q deadcity_test27.zip -d game
      - name: Compile and verify unsigned IPA
        run: bash game/build_scripts/build-ios-unsigned.sh
      - name: Publish test build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=v0.27.0-test27
          assets=(game/build/DeadCityJapan-v27-unsigned.ipa game/build/SHA256SUMS.txt deadcity_test27.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "CHRONICLE TEST 27 - iPhone portrait UI" --notes "Portrait layout for iPhone. Gameplay, Apple AI, and save format carry over from TEST26. Includes portrait layout and keyboard-inset tests." --prerelease
          fi
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Chronicle-TEST27-build-logs
          path: |
            game/build/*.log
            game/build/test-results/
          if-no-files-found: ignore
