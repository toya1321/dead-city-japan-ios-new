# Codemagic: build the unsigned native-Qwen IPA on a hosted Mac.
# Same steps as .github/workflows/ios-native-v14918.yml (macOS job).
workflows:
  ios-v14918-unsigned:
    name: v149.18 unsigned IPA (native Qwen)
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: latest
      vars:
        DCJ_LOCAL_LLM: "1"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/blissful-fermat-8e7k1b-u8y7jb
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Verify and unpack v149.10 source, apply patches
        script: |
          set -euo pipefail
          source_parts=(ci/v149.10-source/part-*)
          test "${#source_parts[@]}" -eq 30
          archive="$TMPDIR/deadcity-v149.10.zip"
          cat "${source_parts[@]}" > "$archive"
          printf '%s  %s\n' '36a2f709df872c42ed478b826816b12c34f79cd8ddaa8416711d6a37d76a9158' "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d game
          for patch in v149.10-ios-build v149.11-local-ai v149.11-comparison v149.16-npc-dialogue v149.17-npc-retry v149.18-npc-requests; do
            git apply --directory=game "ci/$patch.patch"
          done
      - name: Build and verify native unsigned arm64 IPA
        script: |
          set -euo pipefail
          cd game
          bash build_scripts/build-ios-unsigned.sh
    artifacts:
      - game/build/DeadCityJapan-v149.18-*-unsigned.ipa
      - game/build/SHA256SUMS.txt
      - game/build/*.log
